name: CI Checks
run-name: Running Terraform and Snyk Checks by ${{ github.actor }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: terraform-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact

  snyk-checks:
    name: snyk-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --requirement requirements.txt

      - name: Install Snyk CLI
        run: npm install --global snyk

      - name: Snyk Open Source scan
        run: snyk test --file=requirements.txt --package-manager=pip
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code scan
        run: snyk code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk IaC scan
        run: snyk iac test main.tf
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  summary:
    name: Security summary
    if: always()
    needs: [terraform-checks, snyk-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Add job summary
        run: |
          echo '## Package Vulnerability Scan' >> "$GITHUB_STEP_SUMMARY"
          echo '| Job | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo '| terraform-checks | ${{ needs.terraform-checks.result }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| snyk-checks | ${{ needs.snyk-checks.result }} |' >> "$GITHUB_STEP_SUMMARY"
